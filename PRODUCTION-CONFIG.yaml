# PRODUCTION CONFIG - Tech & Cafe
# Mis a jour automatiquement par routine "Reunion strategique hebdomadaire" (lundi 9h GMT)
# Lu par routines production: shorts (02h00 + 02h03 UTC), video longue (02h06 UTC),
# suivi performance (20h GMT quotidien)
#
# AUTORITE EDITORIALE (par ordre, priment sur ce fichier en cas de conflit):
# 1. CONTEXTE-GLOBAL-TECH-CAFE.md (identite, vision, valeurs, hierarchie decision)
# 2. CHARTE-EDITORIALE.md (ton, style, sujets autorises)
# 3. GUIDE-DE-PRODUCTION.md (pipeline 17 etapes, score qualite unifie seuil 80/100, repli 75/100 sur la meilleure tentative - maj 11/08/2026)
# 4. GUIDE-SEO-YOUTUBE.md (strategie SEO, SEO integre au score global unifie, plus de seuil separe - maj 11/08/2026)
# 5. GUIDE-ANALYSE-PERFORMANCES.md (methode d'analyse, checkpoints 24h/48h/7j/30j)
# 6. PROCEDURES-OPERATIONNELLES-SOP.md (SOP 01-12, regles de priorite Partie 6)
# Ce fichier est la traduction operationnelle (technique) de cette doctrine.

---
metadata:
  version: "5.0"
  framework: "doctrine complete Directeur de Production IA (6 documents fondateurs)"
  derniere_maj: "2026-09-28T09:00:00Z"
  # Horaires mis a jour 26/08/2026 suite a la demande de Theo du 23/08 (bloc 2h UTC) - ce champ ne fait PAS foi en cas de doute, le cron reel du trigger (visible via list_triggers) est toujours la source de verite, ce fichier peut se perimer entre deux mises a jour manuelles.
  cycle: "shorts 2x/jour (02h00 + 02h03 UTC) + video longue 1x/jour (02h06 UTC) + suivi performance 1x/jour (20h GMT) + reunion strategique hebdo (lundi 9h GMT)"
  charte: "CONTEXTE-GLOBAL-TECH-CAFE.md"
  gates_qualite:
    score_global_min: 80
    score_global_repli_min: 75
    comportement_si_echec: "auto-revision jusqu'au nombre max de tentatives autorise (3 pour les shorts, 2 pour la video longue). Si aucune tentative n'atteint score_global_min (80), publier quand meme la MEILLEURE tentative si son score >= score_global_repli_min (75). Sous 75: skip, jamais de publication sous ce seuil plancher. (Regle mise a jour 11/08/2026, decision Theo - remplace l'ancien 'jamais de publication sous 90')."
  erreurs_post_publication:
    niveau_1_mineure: "correction description ou commentaire"
    niveau_2_importante: "correction visible aupres du public"
    niveau_3_majeure: "evaluation d'une correction publique complete"
    note: "documenter cause + correction de processus dans BASE-DE-CONNAISSANCES.md a chaque fois (SOP 10)"

# === POLITIQUE DE CONFIDENTIALITE (upload) ===
# IMPORTANT: le champ status.privacyStatus DOIT toujours etre explicite dans
# l'appel API videos.insert (l'API YouTube publie en PUBLIC par defaut si le
# champ est omis). Verifier via videos.list juste apres upload, corriger via
# videos.update si le statut ne correspond pas a celui attendu ci-dessous.
privacy_policy:
  shorts:
    valeur: "private"
    note: "Prive indefiniment depuis reactivation le 05/08 (decision Theo). Pas de bascule automatique vers public - c'est desormais une decision manuelle future de Theo, pas une date programmee. (Historique: une bascule auto au 07/08 avait ete prevue puis annulee le 05/08 avant de prendre effet.)"
  video_longue:
    valeur: "private"
    note: "Prive (decision Theo, 05/08/2026). Theo valide/publie manuellement via YouTube Studio. Remplace le plan d'origine du 02/08 (public direct des le premier jour) - juge trop risque pour une automatisation quotidienne non supervisee, en particulier juste apres l'incident de securite du 04/08 sur ce meme trigger."

# === REACTIVATION SHORTS + VIDEO LONGUE (05/08/2026) ===
# Les 2 triggers shorts et le trigger video longue ont ete reactives le 05/08:
# - trig_01QTPw2RxoroMRcD4E3FthPn (short #1, 7h GMT): re-enabled, contenu mis a
#   jour (privacyStatus = private indefiniment, plus de logique de date)
# - trig_01FPLpqqy8Vh6jmrumuptMzU (short #2, 10h GMT): NOUVEAU trigger, recree
#   car l'original trig_01NXB2L6FyhAcC381Hg3RpRX n'existait plus (supprime
#   pendant le nettoyage securite du 04/08, cause exacte inconnue)
# - trig_0147QDfn9iM9tgPJGYZySEnL (video longue, 18h GMT): entierement
#   reecrit (etait vide/suspendu depuis l'incident du 04/08), inclut
#   desormais conformite CHARTE-GRAPHIQUE.md/GUIDE-MINIATURES.md, chapitres
#   YouTube obligatoires, montage a cuts variables + texte incruste
todo_reactivation_shorts:
  date_cible: "2026-08-05"
  triggers_reactives:
    - "trig_01QTPw2RxoroMRcD4E3FthPn"
    - "trig_01FPLpqqy8Vh6jmrumuptMzU"
    - "trig_0147QDfn9iM9tgPJGYZySEnL"
  fait: true

# === CRITERES DE SELECTION EDITORIALE (charte section 5 et 12) ===
# Un sujet ne peut etre produit QUE s'il repond a au moins un critere de
# valeur, et la hierarchie de decision s'applique dans cet ordre en cas de
# conflit entre options.
criteres_qualite:
  valeur_minimale_requise:
    - "apprendre quelque chose au spectateur"
    - "resoudre un probleme concret"
    - "faire gagner du temps"
    - "expliquer une nouveaute importante"
    - "demystifier une idee recue"
    - "aider a mieux utiliser l'IA"
  regle_stricte: "Si un sujet ne remplit aucun de ces criteres, il n'est PAS produit, meme si le trend/CPM est bon. Repli sur backlog_concepts ou skip ce run."
  hierarchie_decision:
    1: "Exactitude des informations (sources verifiees, incertitudes signalees)"
    2: "Valeur pour le spectateur"
    3: "Qualite editoriale"
    4: "Clarte"
    5: "Performance YouTube (CPM/trend/retention estimee)"
    6: "Rapidite de publication"
  note: "La performance YouTube est un critere legitime mais seulement en 5e position: il depart-age des sujets qui ont deja passe les criteres 1-4, il ne les remplace jamais."

# === DIRECTIVES HEBDO (prioritaire si fichier existe) ===
directives_hebdomadaire:
  enabled: true
  chemin: "directives/directives-production-YYYY-MM-DD.yaml"
  fallback_si_absent: "directives.default"
  note: "Remplace directives.default chaque lundi 10h. Generées lundi 9h par routine analytique. Les directives affinent le CIBLAGE (angles, duree, hook) mais ne peuvent jamais abaisser la barre de criteres_qualite ci-dessus."

# === DIRECTIVES COURANTES ===
directives:
  default:
    angles_privilegier:
      - "Marque IA majeure reconnue + echeance datee et verifiable annoncee dans le titre (nouveau 28/09, confirme sur s10x5nCdL_E: 997 vues temps reel, le meilleur volume brut de la semaine 21-27/09, 47.05% retention, 96.5% trafic SHORTS)"
      - "Chiffre en tete du hook AVEC son referentiel explicite dans la phrase immediatement suivante (regle du 20/08, toujours en vigueur - desormais le gabarit de reference prioritaire: confirme le 28/09 sur XsT_PBX1iRI, 738 vues, 60.99% retention, 0.95% conversion abonnes, plus du double de la moyenne chaine 0.46% - seul cas de la semaine combinant distribution forte ET conversion)"
      - "Securite IA ou la faille/le risque est decouvert ou traite par une IA elle-meme, distinct de la cybersecurite generale hors ligne editoriale (2e cas confirme 28/09 sur DNB2tI0Rjj4: 115 vues, 53.99% retention, 5.3% likes, apres 3TlNMHcm8vs - a formaliser en veille quotidienne SOP01)"
      - "A tester (nouveau 28/09, un seul cas a ce jour): structure 'statistique avant/apres + frustration IA quotidienne resolue' (nd_k65RrXH8, 65.91% retention au checkpoint 30j) - candidat pour generalisation a d'autres irritants IA quotidiens (latence, hallucinations, interruptions de conversation)"
      - "Maintenu sans nouvelle donnee au 28/09 (aucun cas produit ni contredit la semaine du 21-27/09, ne pas abandonner faute de test recent): personnalite/dirigeant IA en rupture ou en aveu (confirme le 31/08 sur -A3JYclGdag et WXDjghr5xEM) ; titre qui leve une objection implicite (cout, complexite, disponibilite) ; sujets IA de niche a fort trafic recherche en format long"
    angles_eviter:
      - "Crypto/blockchain"
      - "Memes/viral culture"
      - "Actualite institutionnelle/business sans framing IA explicite en titre (maintenue au 28/09, aucun nouveau cas ni contre-exemple la semaine du 21-27/09 - confirmee le 31/08 comme l'une des pires categories de la chaine sur cycle complet 30 jours, CO-80p5hffs ~13/100)"
      - "Chiffre-choc en ouverture de hook sans son referentiel immediat dans la phrase suivante (regle du 20/08, reconfirmee une nouvelle fois le 28/09 sur qplzaGsStFg: decrochage retention (RRP 0.101) des 5.2 secondes)"
      - "Meme sujet publie 2 fois la meme semaine sans espacement ni differenciation de titre (mis a jour 28/09, cas AGGRAVE: doublon 'Gemini Live Avatar' du 26/09, FLRbQoDjSQk vs Jxm9NQ8k-f0, les DEUX versions publiees PUBLIQUES simultanement - ecart de 4x en vues a 24h, 393 vs 94 - contre un seul jumeau public lors du precedent cas ChatGPT/Word du 21/09 ; cause structurelle identifiee: SOP04 ne verifie l'anti-doublon que contre BASE-DE-CONNAISSANCES.md, jamais contre les dossiers videos_prod/<date>/ des runs freres en cours le meme jour - correction toujours non appliquee, demandee depuis le 31/08)"
      - "Video longue publiee hors du creneau documente 18:00 GMT (mis a jour 28/09, PRIORITE MAXIMALE INCHANGEE, 4e escalade: les 5 videos longues de la semaine 21-27/09 sont TOUTES hors creneau, 0-8 vues chacune. Root cause reevaluee: le trigger trig_0128y43fLzq5L7g7A3VmYSK8 (ex-trig_013BuZUeGuBZqdSuGmRhk5HQ) tourne toujours sur le cron '6 2 * * *' (02:06 UTC, verifie via list_triggers le 25/09) mais les publications reelles sortent entre 09:55 et 13:00 UTC - un ecart de 6 a 11h entre declenchement du trigger et publication YouTube reelle, non diagnostique a ce jour, distinct du seul probleme de cron deja documente. Voir directives/directives-production-2026-09-28.yaml, section blocage_operationnel_prioritaire.)"
      - "A deprioriser avec prudence (nouveau 28/09, 2e cas defavorable, echantillon encore insuffisant pour en faire une regle ferme): sujet 'fonctionnalite smartphone' sans marque IA reconnue ni chiffre dans le titre (8_8IbPF8O48, 6 vues a 48h)"
    duree_cible: "48-55s"
    hook_strategy: "Deux structures prioritaires egales au 28/09: (1) nommer une marque IA majeure reconnue + une echeance datee et verifiable des la 1ere phrase (meilleur volume brut mesure la semaine du 21-27/09) ; (2) un chiffre en ouverture TOUJOURS suivi immediatement de son referentiel explicite dans la phrase suivante (regle du 20/08, seul gabarit ayant produit a la fois bonne distribution et conversion abonnes superieure a la moyenne la semaine du 21-27/09). Ne jamais laisser un chiffre-choc sans referentiel (nouvelle confirmation d'un decrochage retention sous 10s le 28/09, qplzaGsStFg)."
    retention_target: "46% pour les Shorts (mis a jour 28/09, retention moyenne semaine calendaire 21-27/09 mesuree par le rapport officiel: 44.61%, coherente avec ~45.5% fin aout ; meilleurs performers de la semaine: s10x5nCdL_E 47.05%, XsT_PBX1iRI 60.99%). Pas de cible chiffree fiable pour la video longue tant que le probleme de distribution hors-creneau n'est pas resolu (les 5 videos longues du 21-27/09 sont toutes hors creneau, volume insuffisant pour un signal de contenu exploitable)."
    affiliation_priority:
      - "tech books & courses"
      - "AI tools freemium"
    cpm_target_min: "1.8"
    notes: "Framework par defaut. Remplace par directives hebdo si disponibles. Reste subordonne a criteres_qualite (score global unifie >=80/100, repli 75/100 - GUIDE-DE-PRODUCTION.md maj 11/08/2026, ne remplace plus l'ancien seuil 90/85 mentionne dans certains prompts plus anciens). Voir directives/directives-production-2026-09-28.yaml pour l'analyse complete de la semaine 21-27/09 (rapport officiel + suivi/*.md du 23 au 27/09 + BASE-DE-CONNAISSANCES.md) - conversion abonnes en aggravation mesuree (7 videos sur 8 a 0% de conversion cette semaine, test de CTA renforce lance en priorite) ; signale egalement une lacune de continuite de la routine SOP11 (aucune directive hebdo generee entre le 31/08 et le 28/09, 3 semaines manquees: 07/09, 14/09, 21/09)."

# === BACKLOG EVERGREEN ===
# Concepts rechauffables si veille echoue ou pour complementer
backlog_concepts:
  - id: "EG-001"
    titre: "5 inventions tech oubliees"
    angle: "nostalgia + education"
    description: "Retrace 5 technologies qu'on croyait revolutionnaires mais qui ont disparu. Pourquoi?"
    structure: "Hook: 'Cette techno valait des milliards, où elle est passée?' | Corps: 5 exemples courts | CTA: 'Laquelle tu oubliais?'"
    cpm_estimate: "1.8"

  - id: "EG-002"
    titre: "Predictions tech que tout le monde se trompait"
    angle: "fait-checking futuriste"
    description: "Compile les predictions tech FAUSSES des 10 dernieres annees (experts, CEO, influenceurs)"
    structure: "Hook: 'Les experts se sont tous trompes' | Corps: 3-4 predictions debunkees | CTA: 'Quelle prediction tu croyais?'"
    cpm_estimate: "1.6"

  - id: "EG-003"
    titre: "Comment les IA actuelles se feraient hacker facilement"
    angle: "security awareness"
    description: "Explique 3 vulnerabilites simples des IA/chatbots qu'un ado peut exploiter"
    structure: "Hook: 'Ton ChatGPT va faire ce que tu veux (pas ce qu'il devrait)' | Corps: 3 hacks simples demo | CTA: 'T'as teste?'"
    cpm_estimate: "2.2"

  - id: "EG-004"
    titre: "Pourquoi les smartphone stagnent depuis 2020"
    angle: "tech evolution analysis"
    description: "Analyse pourquoi les innovations smartphone ralentissent (batterie, ecrans, chipsets)"
    structure: "Hook: 'Tu as le meme phone qu'il y a 3 ans' | Corps: 3 raisons tech + economics | CTA: 'T'es d'accord?'"
    cpm_estimate: "1.9"

# === A/B TESTING MINIATURES ===
# Structure pour futur testing (une fois en publication)
miniature_testing:
  enabled: false
  strategy: "une_version_principale_test_futur"
  variants_par_video: 3
  test_duration_days: 1
  swap_condition: "si CTR test > principal + 15%"

# === BRANDING & IDENTITE VISUELLE ===
# Charte graphique 05/08/2026 (construite avec Théo, finalisée pour miniatures auto)
branding:
  autorite_visuelle:
    - "CHARTE-GRAPHIQUE.md (palette, typographies, éléments récurrents)"
    - "GUIDE-MINIATURES.md (template, zones, checklist qualité, 3 templates prédéfinis)"
  palette_couleurs:
    primary_cyan: "#00D9FF"
    primary_orange: "#FF9500"
    bg_black: "#0A0E27"
    text_white: "#FFFFFF"
    text_gray: "#4A5568"
    accent_dark_cyan: "#0099CC"
    accent_dark_orange: "#CC7700"
    light_gray: "#E2E8F0"
  typographies:
    titres:
      famille: "Montserrat Black / Inter Bold"
      poids: 700-900
      taille_miniature_min: "48px"
      taille_miniature_normal: "72-96px"
    corps:
      famille: "Inter Regular"
      poids: 400-500
      taille_miniature: "14-18px"
    accents_callouts:
      famille: "Inter Medium / Montserrat Medium"
      poids: 600
      taille_miniature: "28-36px"
  miniatures:
    dimensions: "1280x720 px (16:9)"
    safe_zone: "1200x680 px (40px margins)"
    mobile_preview: "432x243 px (ce que 95% users voient)"
    format: "PNG ou JPG"
    compression_max: "500 KB"
    couleur_space: "sRGB"
    templates_disponibles:
      - "Template 1: Impact Direct (titre blanc gros, image glow, callout orange, watermark)"
      - "Template 2: Curiosité (titre cyan question, image intrigante, box orange, watermark)"
      - "Template 3: Minimaliste (gradient noir-cyan, titre blanc, callout mini orange, watermark)"
    zones_composition:
      A_titre: "35-40% hauteur, blanc ou cyan, max 2-3 mots, top 20px"
      B_visuel: "20-30% hauteur, image 400x300 min, centré, position 280-380px"
      C_callout: "20-25% hauteur, orange sur box clair, bottom 60px"
      D_watermark: "Logo 80x80, bas-droit (1180px, 620px), 70% opacité"
    checklist_qualite:
      - "Dimensions 1280x720 exact"
      - "Couleurs hex exactes utilisées (copy-paste, pas approximation)"
      - "Titre lisible à 432x243 px (test mobile size)"
      - "Orange visible, WCAG AA minimum"
      - "Watermark présent, discret"
      - "Pas de texte blanc sur orange"
      - "Image centrale visible, pas cachée"
      - "Safe zone 40px respectée"
      - "Fichier <500 KB"
      - "PNG/JPG sRGB"
    qualite_threshold: 90
    comportement_si_echec: "rejeter plutôt que publier dégradé, scorer <90 = non publication"
  logo_watermark:
    assets:
      - "watermark-shorts.png (150x150, RGBA transparent)"
      - "watermark-longue.png (150x150, RGBA transparent)"
      - "icon-transparent-bg.png (260x320, variante alternative)"
    dimensions: "150x150 px (optimal pour visibilité sans intrusivité)"
    position_bas_droit: "X: 1110 px, Y: 550 px (1280x720 canvas)"
    opacite_recommandee: "0.70"
    drop_shadow: "2px blur subtle"
  fallbacks:
    image_introuvable: "background dégradé noir-cyan, agrandir texte, log warning"
    texte_deborde: "réduire police (min 48px), réarranger zones, tester WCAG"
    orange_insuffisant: "augmenter opacité box, ajouter border sombre, tester WCAG"
  metriques_feedback:
    tracer: "CTR par template, domaines couleur, durée génération (<30s)"
    ajustement_si: "CTR cyan >20% mieux → diminuer orange; mobile illisible → augmenter police"
    revision_guide: "tous les 2 semaines basée sur data réelle"
  notes: "Activar quand Théo commence à publier (necessaire au moins 3-4 jours de data)"

# === VIDEO LONGUE (nouveau format, lance 02/08) ===
video_longue:
  enabled: true
  cadence: "7/semaine (quotidien)"
  duree_max: "10min (hard cap, viser 7-9min)"
  objectif_business:
    cible: "1000 abonnes + 4000h watch time"
    fenetre: "90 jours"
    debut: "2026-08-02"
    fin_indicative: "2026-10-31"
  cta: "abonnement explicite et repete (intro + milieu + outro), sans etre lourd"
  structure: "hook fort 15-30s, chapitres/pattern-interrupts ~90s, CTA abonnement recurrent"
  niche_audit_path: "LONGFORM-NICHE-AUDIT.md"
  niche_audit_note: "Executer le prompt 1-audit-niche.txt (adapte format long) une seule fois si le fichier n'existe pas encore, puis le reutiliser aux runs suivants."
  eviter_doublon_avec_shorts_du_jour: true

# === PARAMETRES GLOBAUX ===
params:
  production_times:
    - "short #1: 02:00 UTC"
    - "short #2: 02:03 UTC - doit eviter le sujet du short #1 du meme jour"
    - "video longue: 02:06 UTC"
  output_dir: "videos_prod/YYYY-MM-DD/"
  output_dir_longue: "videos_prod_longue/YYYY-MM-DD/"
  metadata_storage: "repo thabin18-hub/echcafe-visual-library"
  reporting_dir: "livrables/youtube/.../rapports/"
  directives_dir: "livrables/youtube/.../directives/"

  voix_off:
    provider: "Google Cloud Text-to-Speech"
    voice_name: "fr-FR-Studio-A"
    voice_gender: "female"
    language: "fr-FR"
    note: "Decision Theo 08/08/2026 - voix Studio (feminine) confirmee comme standard, ex-fr-FR-Studio-D (masculine). Chirp3-HD teste le meme jour pour la prononciation bilingue des noms d'outils anglais (Notion, GitHub...) et rejete a l'ecoute - conserve ci-dessous a titre de memoire, ne pas reessayer sans nouvelle demande explicite de Theo. Les voix Studio ne supportent de toute facon pas la balise SSML <lang> necessaire a la prononciation bilingue (erreur API 400 confirmee) ; Chirp3-HD ne supporte pas SSML non plus mais promettait un code-switching natif - non concluant a l'ecoute sur ce test precis."
    voice_prefs_historique: ["Studio", "Chirp3-HD"]

  visuels:
    library_local: "~/bibliotheque-visuels/"
    library_drive: "Google Drive sync"
    fallback: "Pexels/Pixabay si besoin"

  qualite:
    son_design: "whoosh, battement, silence strategique"
    transitions: "fade, zoom, pan (naturel)"
    effects: "texte cinetique, zoom progressif (pas tape-a-l-oeil)"

