# === CRITERES DE SELECTION EDITORIALE (charte section 5 et 12) ===
# Un sujet ne peut etre produit QUE s'il repond a au moins un critere de
# valeur, et la hierarchie de decision s'applique dans cet ordre en cas de
# conflit entre options.
criteres_qualite:
  valeur_minimale_requise:
    - "apprendre quelque chose au spectateur"
    - "resoudre un probleme concret"
    - "faire gagner du temps"
    - "expliquer une nouveaute importante"
    - "demystifier une idee recue"
    - "aider a mieux utiliser l'IA"
  regle_stricte: "Si un sujet ne remplit aucun de ces criteres, il n'est PAS produit, meme si le trend/CPM est bon. Repli sur backlog_concepts ou skip ce run."
  hierarchie_decision:
    1: "Exactitude des informations (sources verifiees, incertitudes signalees)"
    2: "Valeur pour le spectateur"
    3: "Qualite editoriale"
    4: "Clarte"
    5: "Performance YouTube (CPM/trend/retention estimee)"
    6: "Rapidite de publication"
  note: "La performance YouTube est un critere legitime mais seulement en 5e position: il depart-age des sujets qui ont deja passe les criteres 1-4, il ne les remplace jamais."

# === DIRECTIVES HEBDO (prioritaire si fichier existe) ===
directives_hebdomadaire:
  enabled: true
  chemin: "directives/directives-production-YYYY-MM-DD.yaml"
  fallback_si_absent: "directives.default"
  note: "Remplace directives.default chaque lundi 10h. Generées lundi 9h par routine analytique. Les directives affinent le CIBLAGE (angles, duree, hook) mais ne peuvent jamais abaisser la barre de criteres_qualite ci-dessus."

# === DIRECTIVES COURANTES ===
directives:
  default:
    angles_privilegier:
      - Marque IA majeure + echeance datee ou chiffre verifiable dans le titre (Microsoft Autopilot 30/09, Apple Safari 17 outils, Ant Group 560 Mds) - gabarit volume, 3 cas confirmes.
      - IA du quotidien/maison/travail d'une marque connue avec benefice concret et mot 'enfin'/'maintenant'/'actifs jour et nuit' (Google Home 61.0% de retention a 7j, Dots 67.2%) - gabarit retention, 2 cas ; a confirmer sur un 3e.
      - Chiffre en tete du hook AVEC son referentiel explicite dans la phrase suivante (regle du 20/08, maintenue).
      - 'Securite IA ou la faille est decouverte/traitee par une IA elle-meme (2 cas confirmes la semaine du 21/09 ; aucun nouveau cas cette semaine : ''Microsoft Ransomware 100% Autonome'' est <24h, 24 vues, non evaluable) - garder en veille SOP01, ne pas promouvoir davantage.'
      - 'Maintenu sans nouvelle donnee : personnalite/dirigeant IA en rupture ou en aveu ; titre qui leve une objection implicite (cout, complexite, disponibilite - GPT-6.1 Sol ''5 fois moins cher'' : 24 vues, retention 50.1%, non concluant).'
    angles_eviter:
      - Sujets industriels/B2B sans angle spectateur (2 cas defavorables, dont `my7fOCxCq94` 10 vues/6.9%).
      - 'Meme produit/annonce publie 2 fois le meme jour (4 cas documentes, dernier : Dots 30/09).'
      - Chiffre-choc/benchmark en ouverture sans effet concret ni referentiel immediat (`qplzaGsStFg` 24.9%).
      - Crypto/blockchain.
      - Memes/viral culture.
      - 'Actualite institutionnelle/business sans cadrage IA explicite dans le titre (regle maintenue ; AMD/World Labs 20 vues, 50.0% retention : titre cadre IA, donc hors regle, volume faible a surveiller).'
      - 'Videos longues publiees hors creneau : blocage operationnel, pas un signal editorial.'
    duree_cible: 'Shorts 48-55s (44-57s mesure, concentre 5/5 meilleurs volumes). Video longue : 7-9 min, inchange (aucun signal de contenu exploitable, 0-6 vues).'
    hook_strategy: '(1) Marque IA majeure nommee des la 1ere phrase + echeance datee ou chiffre verifiable. (2) Si le sujet est un benchmark/precision/prix : ouvrir sur l''effet concret pour le spectateur (''ta meteo'', ''ta facture'', ''ton Safari'') AVANT le chiffre, puis le chiffre avec son referentiel dans la phrase suivante. (3) Pas de chiffre-choc sans referentiel. Rappel exactitude : un hook ne doit jamais promettre plus que ce que le sujet etablit (CONTEXTE-GLOBAL §8) ; un CTR/volume eleve avec retention faible signale une promesse exageree (GUIDE-ANALYSE §4).'
    retention_target: 'Shorts : 45% (moyenne simple 43.0% cette semaine sur 10 Shorts avec Analytics, 44.61% semaine precedente ; meilleurs : Dots 67.2%, Google Home 61.0%). Video longue : toujours aucune cible chiffree fiable tant que la distribution n''est pas diagnostiquee.'
    affiliation_priority:
      - tech books & courses
      - AI tools freemium
    cpm_target_min: '1.8'
    tests_a_mener:
      - 'Hypothese (reconduit du 28/09, NON evalue - aucun Short avec CTA renforce identifie avec Analytics a 48h cette semaine) : un CTA d''abonnement lie a la promesse du sujet (ex. ''le prochain changement Microsoft, je te le dis ici'', suggere par le suivi `B4w00JccMQk`), place pendant le dernier tiers du Short plutot qu''en phrase generique finale, ameliore la conversion abonnes. Objectif : sortir du 0 abonne attribue sur Shorts a 400+ vues (Autopilot, Safari, Google Home). Mesure de reussite : sur 5 Shorts avec CTA lie et Analytics a 48h, au moins 2/5 depassent 0.46% de conversion abonnes (moyenne chaine). Obligation : le suivi 48h doit consigner explicitement ''CTA lie : oui/non'' et le nombre d''abonnes.'
      - 'Hypothese : sur les sujets benchmark/prix/precision, ouvrir sur l''effet concret avant le chiffre ameliore la retention (comparaison `qplzaGsStFg` 24.9% vs `u3rUtTOPXNQ` 61.0%, n=2, non prouve). Objectif : retention des Shorts de type benchmark. Mesure de reussite : sur les 2 prochains Shorts de ce type, retention >=45% sur au moins 1 sur 2 avec >=50 vues Analytics et recul >=48h.'
      - 'Hypothese : un 3e cas ''IA du quotidien d''une marque connue + benefice concret + enfin/maintenant'' confirme le gabarit retention (Google Home 61.0%, Dots 67.2%). Objectif : promouvoir ou ecarter ce gabarit. Mesure de reussite : retention >=55% ET >=100 vues sur le prochain Short de ce type, recul >=48h.'
      - 'Hypothese (reconduit, aucun cas produit cette semaine) : le gabarit ''statistique avant/apres + frustration IA resolue'' (`nd_k65RrXH8`, 65.91% a 30j) se generalise. Mesure : retention 7j >=55% sur 1 des 2 prochains sujets, recul 7j.'
      - 'Hypothese operationnelle (hors qualite editoriale, decision Theo) : pour 1 sujet long a fort volume de recherche, publier le meme sujet en Short 48-55s au meme jour distinct (angle different, jamais meme jour) et comparer le volume a 7j, pour separer ''format long sans autorite'' de ''sujet sans demande''. Mesure : Short >=100 vues et long <10 vues => la contrainte est le format/distribution, pas le sujet. A ne lancer qu''avec validation de Theo (ne modifie pas la cadence).'
    arreter:
      - 'Sujets industriels/B2B sans angle spectateur (Caterpillar, `my7fOCxCq94` : retention 6.9%, 3s de visionnage moyen, 2e cas defavorable de ce type) : ne plus produire sans reformulation centree sur l''impact pour le spectateur.'
      - 'Deux Shorts sur le meme produit/annonce le meme jour (Dots 30/09 : 301 vs 6-9 vues) : arreter, 4e occurrence.'
      - 'Benchmark/precision abstraite ouvert sur le chiffre sans effet concret pour le spectateur (`qplzaGsStFg` : retention 24.9% a 7j, 12s sur 52s ; contraste avec `u3rUtTOPXNQ` 61.0%, meme marque Google, n=2). Ouvrir sur l''effet concret AVANT le chiffre (regle chiffre+referentiel du 20/08 maintenue).'
      - 'Mettre du budget d''attente sur la ''distribution'' des longues sans changement : 7/7 sous 7 vues. Pas de nouveau levier editorial a deployer sur le long tant que le blocage operationnel n''est pas diagnostique (voir blocage_operationnel_prioritaire) - ne pas conclure que le contenu long est mauvais, la donnee ne le permet pas.'
      - 'Conclusions de retention sur moins de 24h ou moins de ~20 vues : Kimi K3 (6 vues, 0.0%), Microsoft Fusionne (6 vues, 10.9%), Dots jumeau (9 vues, 69.5%) ne sont PAS des signaux editoriaux fiables.'
    continuer:
      - 'Gabarit ''marque IA majeure + echeance ou chiffre date verifiable'' : confirme par Autopilot Microsoft ''Des Le 30 Septembre'' (423 vues, ~90% Shorts) et Safari ''17 outils'' (418 vues, 48.5%), en plus de s10x5nCdL_E la semaine precedente - 3 cas independants de bon volume. Reste le gabarit de reference pour le volume. Limite : il ne garantit pas la retention (44-48%) ni la conversion (0 abonne attribue sur Autopilot).'
      - 'Titre ''marque + benefice concret'' + hook court : Dots ''Actifs Jour Et Nuit'' (312 vues, retention 67.2%) et Google Home ''Obeit Enfin'' (212 vues, 61.0% a 7j). Les 2 meilleures retentions a volume > 200 vues ont toutes deux un benefice quotidien concret nomme dans le titre.'
      - 'Shorts 44-57s : concentrent la quasi-totalite du volume (463/423/418/312/122 vues). Duree 48-55s inchangee.'
      - 'Titre commencant par la marque ou le produit (regle du 29/08) : conserver, aucun contre-exemple cette semaine.'
      - 'Anti-doublon par angle distinct pour le long vs Short du meme sujet (Dots Short 30/09 -> long ''risques caches'' 02/10) : respecte, a conserver ; l''effet sur la distribution du long n''est pas mesurable (0-3 vues).'
    notes: 'Framework par defaut, synchronise le 05/10/2026 depuis directives/directives-production-2026-10-05.yaml (semaine 28/09-04/10, 12 videos avec Analytics, CTR/CPM indisponibles). Subordonne a criteres_qualite (score global unifie >=80/100, repli 75/100 - aucun seuil abaisse). Blocages operationnels hors perimetre editorial: 7/7 videos longues hors creneau a 0-6 vues (5e escalade), anti-doublon (4e cas, Dots 30/09), secret expose en clair dans une sortie de commande (ticket separe) - voir blocage_operationnel_prioritaire du fichier directives.'

# === BACKLOG EVERGREEN ===
# Concepts rechauffables si veille echoue ou pour complementer
backlog_concepts:
  - id: "EG-001"
    titre: "5 inventions tech oubliees"
    angle: "nostalgia + education"
    description: "Retrace 5 technologies qu'on croyait revolutionnaires mais qui ont disparu. Pourquoi?"
    structure: "Hook: 'Cette techno valait des milliards, où elle est passée?' | Corps: 5 exemples courts | CTA: 'Laquelle tu oubliais?'"
    cpm_estimate: "1.8"

  - id: "EG-002"
    titre: "Predictions tech que tout le monde se trompait"
    angle: "fait-checking futuriste"
    description: "Compile les predictions tech FAUSSES des 10 dernieres annees (experts, CEO, influenceurs)"
    structure: "Hook: 'Les experts se sont tous trompes' | Corps: 3-4 predictions debunkees | CTA: 'Quelle prediction tu croyais?'"
    cpm_estimate: "1.6"

  - id: "EG-003"
    titre: "Comment les IA actuelles se feraient hacker facilement"
    angle: "security awareness"
    description: "Explique 3 vulnerabilites simples des IA/chatbots qu'un ado peut exploiter"
    structure: "Hook: 'Ton ChatGPT va faire ce que tu veux (pas ce qu'il devrait)' | Corps: 3 hacks simples demo | CTA: 'T'as teste?'"
    cpm_estimate: "2.2"

  - id: "EG-004"
    titre: "Pourquoi les smartphone stagnent depuis 2020"
    angle: "tech evolution analysis"
    description: "Analyse pourquoi les innovations smartphone ralentissent (batterie, ecrans, chipsets)"
    structure: "Hook: 'Tu as le meme phone qu'il y a 3 ans' | Corps: 3 raisons tech + economics | CTA: 'T'es d'accord?'"
    cpm_estimate: "1.9"

# === A/B TESTING MINIATURES ===
# Structure pour futur testing (une fois en publication)
miniature_testing:
  enabled: false
  strategy: "une_version_principale_test_futur"
  variants_par_video: 3
  test_duration_days: 1
  swap_condition: "si CTR test > principal + 15%"

# === BRANDING & IDENTITE VISUELLE ===
# Charte graphique 05/08/2026 (construite avec Théo, finalisée pour miniatures auto)
branding:
  autorite_visuelle:
    - "CHARTE-GRAPHIQUE.md (palette, typographies, éléments récurrents)"
    - "GUIDE-MINIATURES.md (template, zones, checklist qualité, 3 templates prédéfinis)"
  palette_couleurs:
    primary_cyan: "#00D9FF"
    primary_orange: "#FF9500"
    bg_black: "#0A0E27"
    text_white: "#FFFFFF"
    text_gray: "#4A5568"
    accent_dark_cyan: "#0099CC"
    accent_dark_orange: "#CC7700"
    light_gray: "#E2E8F0"
  typographies:
    titres:
      famille: "Montserrat Black / Inter Bold"
      poids: 700-900
      taille_miniature_min: "48px"
      taille_miniature_normal: "72-96px"
    corps:
      famille: "Inter Regular"
      poids: 400-500
      taille_miniature: "14-18px"
    accents_callouts:
      famille: "Inter Medium / Montserrat Medium"
      poids: 600
      taille_miniature: "28-36px"
  miniatures:
    dimensions: "1280x720 px (16:9)"
    safe_zone: "1200x680 px (40px margins)"
    mobile_preview: "432x243 px (ce que 95% users voient)"
    format: "PNG ou JPG"
    compression_max: "500 KB"
    couleur_space: "sRGB"
    templates_disponibles:
      - "Template 1: Impact Direct (titre blanc gros, image glow, callout orange, watermark)"
      - "Template 2: Curiosité (titre cyan question, image intrigante, box orange, watermark)"
      - "Template 3: Minimaliste (gradient noir-cyan, titre blanc, callout mini orange, watermark)"
    zones_composition:
      A_titre: "35-40% hauteur, blanc ou cyan, max 2-3 mots, top 20px"
      B_visuel: "20-30% hauteur, image 400x300 min, centré, position 280-380px"
      C_callout: "20-25% hauteur, orange sur box clair, bottom 60px"
      D_watermark: "Logo 80x80, bas-droit (1180px, 620px), 70% opacité"
    checklist_qualite:
      - "Dimensions 1280x720 exact"
      - "Couleurs hex exactes utilisées (copy-paste, pas approximation)"
      - "Titre lisible à 432x243 px (test mobile size)"
      - "Orange visible, WCAG AA minimum"
      - "Watermark présent, discret"
      - "Pas de texte blanc sur orange"
      - "Image centrale visible, pas cachée"
      - "Safe zone 40px respectée"
      - "Fichier <500 KB"
      - "PNG/JPG sRGB"
    qualite_threshold: 90
    comportement_si_echec: "rejeter plutôt que publier dégradé, scorer <90 = non publication"
  logo_watermark:
    assets:
      - "watermark-shorts.png (150x150, RGBA transparent)"
      - "watermark-longue.png (150x150, RGBA transparent)"
      - "icon-transparent-bg.png (260x320, variante alternative)"
    dimensions: "150x150 px (optimal pour visibilité sans intrusivité)"
    position_bas_droit: "X: 1110 px, Y: 550 px (1280x720 canvas)"
    opacite_recommandee: "0.70"
    drop_shadow: "2px blur subtle"
  fallbacks:
    image_introuvable: "background dégradé noir-cyan, agrandir texte, log warning"
    texte_deborde: "réduire police (min 48px), réarranger zones, tester WCAG"
    orange_insuffisant: "augmenter opacité box, ajouter border sombre, tester WCAG"
  metriques_feedback:
    tracer: "CTR par template, domaines couleur, durée génération (<30s)"
    ajustement_si: "CTR cyan >20% mieux → diminuer orange; mobile illisible → augmenter police"
    revision_guide: "tous les 2 semaines basée sur data réelle"
  notes: "Activar quand Théo commence à publier (necessaire au moins 3-4 jours de data)"

# === VIDEO LONGUE (nouveau format, lance 02/08) ===
video_longue:
  enabled: true
  cadence: "7/semaine (quotidien)"
  duree_max: "10min (hard cap, viser 7-9min)"
  objectif_business:
    cible: "1000 abonnes + 4000h watch time"
    fenetre: "90 jours"
    debut: "2026-08-02"
    fin_indicative: "2026-10-31"
  cta: "abonnement explicite et repete (intro + milieu + outro), sans etre lourd"
  structure: "hook fort 15-30s, chapitres/pattern-interrupts ~90s, CTA abonnement recurrent"
  niche_audit_path: "LONGFORM-NICHE-AUDIT.md"
  niche_audit_note: "Executer le prompt 1-audit-niche.txt (adapte format long) une seule fois si le fichier n'existe pas encore, puis le reutiliser aux runs suivants."
  eviter_doublon_avec_shorts_du_jour: true

# === PARAMETRES GLOBAUX ===
params:
  production_times:
    - "short #1: 02:00 UTC"
    - "short #2: 02:03 UTC - doit eviter le sujet du short #1 du meme jour"
    - "video longue: 02:06 UTC"
  output_dir: "videos_prod/YYYY-MM-DD/"
  output_dir_longue: "videos_prod_longue/YYYY-MM-DD/"
  metadata_storage: "repo thabin18-hub/echcafe-visual-library"
  reporting_dir: "livrables/youtube/.../rapports/"
  directives_dir: "livrables/youtube/.../directives/"

  voix_off:
    provider: "Google Cloud Text-to-Speech"
    voice_name: "fr-FR-Studio-A"
    voice_gender: "female"
    language: "fr-FR"
    note: "Decision Theo 08/08/2026 - voix Studio (feminine) confirmee comme standard, ex-fr-FR-Studio-D (masculine). Chirp3-HD teste le meme jour pour la prononciation bilingue des noms d'outils anglais (Notion, GitHub...) et rejete a l'ecoute - conserve ci-dessous a titre de memoire, ne pas reessayer sans nouvelle demande explicite de Theo. Les voix Studio ne supportent de toute facon pas la balise SSML <lang> necessaire a la prononciation bilingue (erreur API 400 confirmee) ; Chirp3-HD ne supporte pas SSML non plus mais promettait un code-switching natif - non concluant a l'ecoute sur ce test precis."
    voice_prefs_historique: ["Studio", "Chirp3-HD"]

  visuels:
    library_local: "~/bibliotheque-visuels/"
    library_drive: "Google Drive sync"
    fallback: "Pexels/Pixabay si besoin"

  qualite:
    son_design: "whoosh, battement, silence strategique"
    transitions: "fade, zoom, pan (naturel)"
    effects: "texte cinetique, zoom progressif (pas tape-a-l-oeil)"

