# === RESULTATS DES TESTS DE LA SEMAINE PRECEDENTE (directives 24/08) ===
resultats_tests_semaine_precedente:
  - "Test 1 (spectateur possede deja le produit + changement subi + date ferme, objectif retention >=70% sur 2/3 prochains sujets) : RESULTAT MITIGE, hypothese NUANCEE. 2 candidats testes cette semaine (`dxjOMygjD98` o3->GPT-5, `dYNLzfArczE` DALL-E) - aucun n'atteint la cible de 70%. `dxjOMygjD98` reste un contre-exemple positif sur la courbe RELATIVE (pas de decrochage severe, 0,38-0,61 sur toute la duree) mais 40,27% en absolu ; `dYNLzfArczE` infirme franchement l'hypothese (19,36%, decrochage des la 1ere seconde mesuree, l'un des pires de la semaine). L'hypothese initiale (fondee sur le cas exceptionnel TV8jLECHVb0) ne se generalise donc pas automatiquement - le facteur determinant semble etre la structure reelle du script/hook, pas seulement le respect des 3 criteres du gabarit. Echantillon encore insuffisant (2 cas) pour trancher definitivement."
  - "Test 2 (referentiel du chiffre-hook explicite, objectif perte d'audience <20% avant 8,5s sur 3 Shorts >=20 vues avec courbe detaillee) : NON MESURABLE cette semaine - aucun nouveau Short avec hook 'chiffre + referentiel' explicite n'a atteint le stade de courbe de retention detaillee dans la fenetre Analytics disponible cette semaine (delai de traitement J-2 combine a des publications tardives dans la semaine). A reevaluer imperativement la semaine prochaine sur les Shorts publies fin aout avec ce hook."
  - "Test 3 (creation IA hors musique, objectif conversion abonnes >=1% sur 2 nouveaux sujets image/video/voix) : EN COURS, NON TRANCHE. `FRVJ22U_WHo` ('ChatGPT Transforme Tes Photos En Stickers Gratuits') est le candidat de la semaine (1er test du volet image) mais reste au stade 48h sans donnee Analytics de conversion disponible (72 vues/39h, retention/abonnes non mesures faute de traitement Analytics a temps). A reevaluer au 7j la semaine prochaine."

